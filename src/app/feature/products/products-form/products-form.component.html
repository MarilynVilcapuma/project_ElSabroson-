<div class="modal-container" *ngIf="visible">
  <div class="modal">
    <div class="modal-header">
      <h2>Nuevo Producto</h2>
      <p>Completa el formulario para crear un nuevo producto</p>
      <!-- Botón cerrar -->
      <button class="close-button" aria-label="Cerrar" (click)="onCancel()">×</button>
    </div>

    <form class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="input error" placeholder="Ingrese el nombre" [(ngModel)]="product.name" name="name" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" class="input" placeholder="Ingrese la descripción" [(ngModel)]="product.description" name="description" />
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <input type="text" class="input" placeholder="Ingrese la categoría" [(ngModel)]="product.category" name="category" />
      </div>

      <div class="form-group">
        <label>Precio</label>
        <input type="number" class="input" placeholder="Ingrese el precio" [(ngModel)]="product.price" name="price" step="0.01" />
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select class="input" [(ngModel)]="product.state" name="state">
          <option>Activo</option>
          <option>Inactivo</option>
        </select>
      </div>
    </form>

    <div class="modal-footer">
      <!-- Botón cancelar -->
      <button class="btn cancel" type="button" (click)="onCancel()">Cancelar</button>
      <!-- Botón crear -->
      <button class="btn confirm" type="button" (click)="onCreate()">Crear producto</button>
    </div>
  </div>
</div>
