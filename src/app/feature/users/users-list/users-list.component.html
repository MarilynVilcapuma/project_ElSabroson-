<div class="container">
  <div class="header">
    <h1>Usuarios</h1>
    <button class="btn-nuevo" (click)="openUserForm()">+ Nuevo Usuario</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Gestión de Usuarios</h2>
      <p>Administra los usuarios del sistema</p>
      <div class="toolbar">
        <input
          type="text"
          placeholder="Buscar por nombre, documento o email..."
          [(ngModel)]="searchTerm"
          (input)="filterUsers()" />

        <select>
          <option>Todos los roles</option>
          <option>Administrador</option>
          <option>Empleados</option>
          <option>Clientes</option>
        </select>

        <select>
          <option>Todos los estados</option>
          <option>Activos</option>
          <option>Inactivos</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Correo</th>
          <th>Celular</th>
          <th>Rol</th>
          <th>Registro</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.nombre }}</td>
          <td>DNI: {{ user.documento }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.celular }}</td>
          <td>
            <span class="badge" [ngClass]="user.rol.toLowerCase()">
              {{ user.rol }}
            </span>
          </td>
          <td>{{ user.registro }}</td>
          <td>
            <span class="estado" [ngClass]="user.estado.toLowerCase()">
              {{ user.estado }}
            </span>
          </td>
          <td class="acciones">
            <button class="icon-btn editar" title="Editar">
              <i class="fas fa-pen"></i>
            </button>
            <button class="icon-btn eliminar" title="Eliminar">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-users-form
    [visible]="showUserForm"
    (cancel)="closeUserForm()"
    (create)="createUser($event)">
  </app-users-form>
</div>
